name: Validate and Bundle Gym Sports Data Set

on:
  push:
    branches:
      - main
      - '**' # Run on any branch, but only create a release on main
    paths:
      - 'data-sets/sports/**'
      - '.github/workflows/validate-and-bundle-gym-sports.yml'

jobs:
  validate-and-bundle:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Validate markdown files
      run: |
        # Ensure all files in the directory are markdown files
        for file in $(find ./data-sets/sports -type f); do
          if [[ "${file}" != *.md ]]; then
            echo "Error: $file is not a markdown file."
            exit 1
          fi
        done

        # Validate markdown file contents
        for file in ./data-sets/sports/*.md; do
          # Ignore files starting with an underscore
          if [[ "$(basename "$file")" == _* ]]; then
            continue
          fi

          # The file name is the public URL slug, so it has to be usable as one.
          slug="$(basename "$file" .md)"
          if ! [[ "$slug" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
            echo "Error: $file does not give a usable slug. Use lower case letters, numbers and single hyphens, for example olympic-weightlifting.md."
            exit 1
          fi

          # Check for required headers
          if ! grep -q "^# Sport:" "$file"; then
            echo "Error: $file is missing the '# Sport:' header."
            exit 1
          fi

          if ! grep -q "^## Short Description" "$file"; then
            echo "Error: $file is missing the '## Short Description' header."
            exit 1
          fi

          if ! grep -q "^## Description" "$file"; then
            echo "Error: $file is missing the '## Description' header."
            exit 1
          fi

          # Raw HTML is escaped by consumers rather than rendered, so it is a mistake in the data
          # and the reader sees the tag. '## Benefits Of Gym Training' is optional and not checked.
          if grep -qE "</?(p|ul|ol|li|div|table|tr|td|th|br|h[1-6]|strong|em|a|span|small)[ />]" "$file"; then
            echo "Error: $file contains raw HTML. Use markdown; HTML is escaped and shown to readers as literal text."
            exit 1
          fi
        done

    - name: Get the current version
      id: get_version
      run: echo "RELEASE_VERSION=$(date +'%Y.%m.%d.%H%M%S')" >> $GITHUB_ENV

    - name: Create a zip file of markdown files
      run: |
        mkdir -p release
        cd ./data-sets/sports
        zip -r ../../release/gym_sports_dataset_${{ env.RELEASE_VERSION }}.zip ./*.md
        cd ../../

    - name: Upload zip artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: gym_sports_dataset
        path: ./release/gym_sports_dataset_${{ env.RELEASE_VERSION }}.zip

    # gh is preinstalled on the runner. The equipment workflow still uses
    # actions/create-release@v1 and actions/upload-release-asset@v1, both of which are archived
    # and unmaintained, so this workflow does not copy them. The tag is prefixed 'sports-' so the
    # two data sets do not compete for the same v{timestamp} tag namespace.
    - name: Create a new release
      if: github.ref == 'refs/heads/main'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create "sports-v${{ env.RELEASE_VERSION }}" \
          "./release/gym_sports_dataset_${{ env.RELEASE_VERSION }}.zip#sport_files_${{ env.RELEASE_VERSION }}.zip" \
          --title "Gym Sports Dataset ${{ env.RELEASE_VERSION }}" \
          --notes "Sports data set, generated from data-sets/sports."
